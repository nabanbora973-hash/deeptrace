services:
  - type: web
    name: deeptrace
    runtime: docker
    plan: free            # 512 MB / 0.1 CPU - sleeps after 15 min idle
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DEEPTRACE_MAX_FACES
        value: "2"
      - key: DEEPTRACE_MAX_FRAMES
        value: "24"        # keep CPU + memory inside the free tier
      - key: DEEPTRACE_MAX_UPLOAD_MB
        value: "60"
      # Render injects $PORT itself - do not pin it.
      - key: WEB_CONCURRENCY
        value: "1"
